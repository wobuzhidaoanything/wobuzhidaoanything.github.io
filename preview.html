<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roomcraft preview</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; }
    #stage { position: fixed; inset: 0; }
    .tag { position: fixed; left: 16px; top: 14px; z-index: 5; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); max-width: 70%; }
    .tag b { display: block; font-size: 15px; }
    .tag .row { display: flex; gap: 6px; align-items: center; margin-top: 3px; color: var(--muted); }
    .tag .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
    .view { position: fixed; right: 16px; top: 14px; z-index: 5; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.9); border-radius: 8px; padding: 4px 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh/build/index.module.js",
      "three-bvh-csg": "./vendor/three-bvh-csg/build/index.module.js",
      "three-gpu-pathtracer": "./vendor/three-gpu-pathtracer/build/index.module.js",
      "camera-controls": "./vendor/camera-controls/dist/camera-controls.module.js",
      "n8ao": "./vendor/n8ao/dist/N8AO.js",
      "postprocessing": "./vendor/postprocessing/build/index.js",
      "polygon-clipping": "./vendor/polygon-clipping/dist/polygon-clipping.esm.js",
      "splaytree": "./vendor/splaytree/dist/splaytree.js",
      "robust-predicates": "./vendor/robust-predicates/index.js",
      "react": "./r3f/react.js",
      "react/jsx-runtime": "./r3f/jsx-runtime.js",
      "@react-three/fiber": "./r3f/fiber.js",
      "@react-three/drei": "./r3f/drei.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="tag" id="tag" hidden></div>
  <div class="view" id="viewName"></div>
  <script type="module" src="js/preview.js"></script>
</body>
</html>
