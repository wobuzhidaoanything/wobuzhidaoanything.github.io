<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roomcraft</title>
  <meta name="description" content="Design a whole house in 3D, furnish it from any store link, and walk through it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%232f6fed'/%3E%3Crect x='13' y='19' width='6' height='8' fill='%2393b4f7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Dark or light before anything draws (Settings → Appearance; "system" follows the computer)
    try {
      const t = JSON.parse(localStorage.getItem('roomcraft.pref.theme') || '"system"');
      document.documentElement.dataset.theme = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch {}
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh/build/index.module.js",
      "three-bvh-csg": "./vendor/three-bvh-csg/build/index.module.js",
      "three-gpu-pathtracer": "./vendor/three-gpu-pathtracer/build/index.module.js",
      "camera-controls": "./vendor/camera-controls/dist/camera-controls.module.js",
      "n8ao": "./vendor/n8ao/dist/N8AO.js",
      "postprocessing": "./vendor/postprocessing/build/index.js",
      "polygon-clipping": "./vendor/polygon-clipping/dist/polygon-clipping.esm.js",
      "splaytree": "./vendor/splaytree/dist/splaytree.js",
      "robust-predicates": "./vendor/robust-predicates/index.js",
      "react": "./r3f/react.js",
      "react/jsx-runtime": "./r3f/jsx-runtime.js",
      "react-dom": "./r3f/react-dom.js",
      "lucide-react": "./r3f/icons.js",
      "@react-three/fiber": "./r3f/fiber.js",
      "@react-three/drei": "./r3f/drei.js"
    }
  }
  </script>
</head>
<body>
  <header class="topbar"></header>

  <div class="layout">
    <aside class="left panel" id="leftPanel"></aside>

    <main class="stage" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="north-arrow" id="northArrow" hidden title="North"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/><path d="M20 5 L26 24 L20 20 L14 24 Z"/><text x="20" y="36" text-anchor="middle">N</text></svg></div>
      <button class="edge-btn left" id="toggleLeft" title="Hide/show the left panel ([)" aria-label="Toggle left panel"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="edge-btn right" id="toggleRight" title="Hide/show the right panel (])" aria-label="Toggle right panel"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="walk-ui" id="walkUI" hidden>
        <div class="crosshair"></div>
        <div class="walk-help" id="walkHelp"></div>
      </div>
      <div id="stageUI"></div>
      <div class="loading" id="loading">Loading…</div>
    </main>

    <aside class="right panel" id="inspector"></aside>
  </div>

  <input type="file" id="designFile" accept=".json,application/json" hidden>
  <input type="file" id="dxfFile" accept=".dxf" hidden>
  <div class="drop-overlay" id="dropOverlay" hidden><div>Drop links to import</div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
